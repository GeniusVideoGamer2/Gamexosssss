name: Build GameXOSTR ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt update && sudo apt install -y gcc make xorriso grub-pc-bin grub-common
      - name: Build
        run: chmod +x build.sh && ./build.sh
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: GameXOSTR-ISO
          path: GameXOSTR.iso
