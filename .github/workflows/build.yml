name: Build GameXOSTR ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, Eben ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y live-build debootstrap debian-archive-keyring squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools
      - name: Build
        run: sudo bash build.sh
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: GameXOSTR-ISO
          path: GameXOSTR.iso
          if-no-files-found: error
