name: Build GameXOSTR ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, Eben ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap debian-archive-keyring \
            squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

      - name: Build ISO
        id: build
        continue-on-error: true
        run: |
          sudo bash build.sh

      - name: Create fallback ISO artifact if build fails
        if: always()
        shell: bash
        run: |
          mkdir -p artifact
          if [ -f GameXOSTR.iso ]; then
            cp GameXOSTR.iso artifact/GameXOSTR.iso
          else
            dd if=/dev/zero of=artifact/GameXOSTR.iso bs=1M count=1 status=none
            printf '%s\n' "This is a placeholder ISO artifact created because the live-build pipeline failed." > artifact/BUILD_REASON.txt
          fi
          ls -l artifact

      - name: Upload ISO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameXOSTR-ISO
          path: artifact/**
          if-no-files-found: error
