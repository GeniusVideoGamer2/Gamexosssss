name: Build GameXOSTR ISO

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap debian-archive-keyring \
            squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin \
            mtools syslinux-utils

      - name: Build ISO
        run: sudo bash build.sh

      - name: Validate bootable ISO
        shell: bash
        run: |
          test -s GameXOSTR.iso
          size_bytes="$(stat -c '%s' GameXOSTR.iso)"
          if (( size_bytes < 100000000 )); then
            echo "ISO is unexpectedly small: ${size_bytes} bytes" >&2
            exit 1
          fi
          xorriso -indev GameXOSTR.iso -report_el_torito plain > /tmp/el-torito-report.txt
          grep -qi 'El Torito' /tmp/el-torito-report.txt

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameXOSTR-ISO
          path: GameXOSTR.iso
          if-no-files-found: error
